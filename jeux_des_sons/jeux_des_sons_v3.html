<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entends-tu le son ?</title><style>
:root{--yellow:#ffd83d;--cream:#fff8df;--black:#171717;--green:#36a65a;--red:#d93025}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--black);font-family:Arial,sans-serif;font-weight:700}
.wrap{width:min(100%,690px);margin:0 auto;padding:10px 12px 18px}
header{text-align:center;padding:0 0 10px}
h1{margin:0;font-size:28px;line-height:1.15}
.sound-nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.sound-tab{min-width:42px;min-height:34px;padding:5px 11px;border:0;border-radius:18px;background:#eee;font-size:16px}
.sound-tab.active{background:var(--yellow);border:2px solid var(--yellow)}
.sound-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--yellow);border-radius:12px;min-width:38px;height:38px;padding:0 11px;font-size:22px;margin:0 auto 7px}
.instruction-row{display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 10px}
.instruction{text-align:center;font-size:15px;line-height:1.2;margin:0}
.speaker{border:0;background:#fff;font-size:18px;padding:2px 3px;min-height:30px;line-height:1;cursor:pointer;border-radius:8px}
.speaker:focus{outline:3px solid #4c9ffe;outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:var(--yellow);border-radius:15px;padding:9px;text-align:center;transition:border .15s ease,box-shadow .15s ease}
.image-box{height:120px;background:var(--cream);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.image-box img{width:100%;height:100%;object-fit:contain}
.placeholder{font-size:54px}
.word{width:100%;border:0;background:var(--cream);color:var(--black);border-radius:10px;margin:6px 0;padding:7px 4px;font-size:18px;line-height:1.1;min-height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.answer{border:0;border-radius:10px;background:#fff;min-height:39px;padding:6px 4px;font-size:15px;font-weight:700;cursor:pointer}
.answer.selected{box-shadow:inset 0 0 0 3px #e8b900;background:#fffdf0}
.item.wrong{box-shadow:0 0 0 6px var(--red);border-radius:15px}
.item.good{box-shadow:0 0 0 4px var(--green);border-radius:15px}
.validate{display:block;margin:11px auto 0;border:0;border-radius:10px;background:#2b2b2b;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.result{text-align:center;font-size:14px;line-height:1.2;margin:8px 0 0;min-height:17px}
.empty{grid-column:1/-1;background:var(--cream);border:3px solid var(--yellow);border-radius:15px;padding:25px 16px;text-align:center;font-size:18px;line-height:1.35}
.empty strong{display:block;font-size:20px;margin-bottom:7px}
footer{text-align:center;font-size:8px;line-height:1.25;font-weight:400;margin-top:22px;padding-bottom:3px}
@media(max-width:520px){.wrap{padding-left:9px;padding-right:9px}.grid{grid-template-columns:1fr 1fr;gap:7px}.item{padding:7px;border-radius:13px}.image-box{height:105px}.word{font-size:16px;margin:5px 0;padding:6px 3px;min-height:32px}.answer{min-height:36px;font-size:14px}.sound-nav{gap:4px}.sound-tab{min-width:36px;padding:4px 8px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.image-box{height:150px}}
</style></head><body>

function render(){tabs();const arr=DATA.exercises[active]||[],g=document.getElementById("grid"),s=SOUNDS.find(x=>x.id===active);document.getElementById("result").textContent="";document.getElementById("soundBadge").textContent=s.label;document.getElementById("instruction").textContent=arr.length?"Est-ce que tu entends le son "+s.label+" ?":"";g.innerHTML="";if(!arr.length){g.innerHTML='<div class="empty"><strong>🔊 Pas encore d’exercice pour ce son.</strong>Ce son n’a pas encore d’exercice.</div>';return}arr.forEach((it,i)=>{let d=document.createElement("div");d.className="item";d.id="item"+i;d.innerHTML='<div class="image-box">'+(it.image?'<img src="'+it.image+'" alt="">':'<div class="placeholder">🖼️</div>')+'</div><button class="word" onclick="speakWord('+i+')" aria-label="Écouter '+esc(it.word)+'" title="Écouter le mot">🔊 '+esc(it.word)+'</button><div class="answers"><button class="answer" onclick="answer('+i+',true)">OUI</button><button class="answer" onclick="answer('+i+',false)">NON</button></div>';g.appendChild(d)})}
function answer(i,v){answers[i]=v;document.getElementById("item"+i).querySelectorAll(".answer").forEach((b,k)=>b.classList.toggle("selected",(k===0)===v))}
function validate(){const arr=DATA.exercises[active]||[];let score=0;arr.forEach((it,i)=>{let d=document.getElementById("item"+i);d.classList.remove("wrong","good");if(answers[i]===it.answer){score++;d.classList.add("good")}else d.classList.add("wrong")});if(arr.length)document.getElementById("result").textContent=score+" / "+arr.length+" — "+(score===arr.length?"🎉 Bien joué !":"Les cadres rouges indiquent les réponses à revoir.")}
function getFrenchVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>/^fr(-|_)/i.test(v.lang))||voices.find(v=>/^fr/i.test(v.lang))||null}
function speakText(text){if(!('speechSynthesis' in window))return;const speakNow=()=>{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';const voice=getFrenchVoice();if(voice)u.voice=voice;u.rate=0.9;u.pitch=1;speechSynthesis.speak(u)};const voices=speechSynthesis.getVoices();if(voices.length){setTimeout(speakNow,120)}else{speechSynthesis.addEventListener('voiceschanged',speakNow,{once:true});setTimeout(speakNow,500)}}
function speakInstruction(){const arr=DATA.exercises[active]||[];if(!arr.length)return;const s=SOUNDS.find(x=>x.id===active);speakText("Est ce que tu entends le son ... "+s.label+" ?")}
function speakWord(i){const arr=DATA.exercises[active]||[];if(!arr[i])return;speakText(arr[i].word)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}render();setTimeout(()=>speakInstruction(),700);
