<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remets les phrases dans l'ordre</title>
  <style>
    :root {
      --yellow: #ffd83d;
      --yellow-soft: #fff7d7;
      --cream: #fffdf5;
      --ink: #171717;
      --green: #35a853;
      --red: #d94841;
      --blue: #2367d1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--ink);
    }
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 20px 40px; }
    header { text-align: center; margin-bottom: 22px; }
    h1 { font-size: clamp(26px, 5vw, 42px); margin: 0 0 8px; }
    .subtitle { font-size: clamp(16px, 2.5vw, 20px); margin: 0 0 18px; color: #555; }

    /* --- NAVIGATION NIVEAUX --- */
    .mode { 
      display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 18px auto 10px; 
      position: relative; z-index: 10;
    }
    .mode button {
      border: 2px solid #222; background: white; border-radius: 999px;
      padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .mode button.active { background: #222; color: #fff; }
    
    .hint { text-align: center; min-height: 28px; font-size: 16px; font-weight: 600; margin: 10px 0 18px; }
    
    /* --- CADRE DE L'EXERCICE (Charte graphique Jaune) --- */
    .exercise {
      background: var(--yellow); border-radius: 30px; padding: 24px;
      max-width: 820px; margin: 0 auto;
    }
    
    /* Zone de dépôt (Phrase en construction) */
    .zone-reponse {
      background: var(--yellow-soft); border-radius: 25px;
      min-height: 140px; display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 10px; padding: 20px; margin-bottom: 20px;
      border: 2px dashed rgba(0,0,0,0.15);
    }

    /* Zone des mots mélangés */
    .zone-mots {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
      min-height: 80px; padding: 10px; background: rgba(255,255,255,0.3);
      border-radius: 20px; margin-bottom: 15px;
    }

    /* --- ÉTIQUETTES DES MOTS --- */
    .word-btn {
      background: #fff; border: 3px solid #fff; border-radius: 16px;
      padding: 12px 20px; font-size: 18px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.1s ease;
      user-select: none;
    }
    .word-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.1); }
    .word-btn:active { transform: translateY(0); }
    
    /* --- ÉTATS DE CORRECTION --- */
    .word-btn.correct { border-color: var(--green); background: #eaf6ec; }
    .word-btn.wrong { border-color: var(--red); background: #fdf2f2; }

    .feedback {
      min-height: 34px; text-align: center; padding-top: 5px;
      font-size: 22px; font-weight: 800;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    /* --- BOUTONS ACTIONS --- */
    .actions { text-align: center; margin-top: 20px; }
    #validate {
      border: 0; border-radius: 18px; background: #222; color: #fff;
      padding: 15px 32px; font-size: 20px; font-weight: 800; cursor: pointer;
    }
    #validate:disabled { opacity: .45; cursor: not-allowed; }
    #next {
      margin-left: 10px; border: 2px solid #222; border-radius: 18px; background: #fff;
      padding: 13px 26px; font-size: 18px; font-weight: 600; cursor: pointer;
    }

    .progress { text-align: center; font-weight: 800; font-size: 16px; margin-top: 20px; }
    .sound {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%; background: var(--yellow);
    font-size: 24px; cursor: pointer; border: 0; vertical-align: middle; margin-left: 8px;
    }
    .sound:hover { transform: scale(1.05); }

    footer { text-align: center; margin-top: 22px; color: #555; font-size: 14px; }

    /* 📱 RESPONSIVE MOBILE */
    @media (max-width: 600px) {
      .mode { flex-direction: column; gap: 5px; }
      .mode button { padding: 10px; font-size: 14px; }
      .exercise { padding: 15px; border-radius: 20px; }
      .word-btn { padding: 8px 14px; font-size: 15px; border-radius: 12px; }
      .zone-reponse { min-height: 110px; padding: 10px; }
      #validate, #next { width: 100%; margin: 5px 0; }
      #next { margin-left: 0; }
    }
  </style>
  <!-- Lien vers le manifest de cet exercice -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="page">
  <header>
    <!-- 🔊 Ajout du bouton haut-parleur dans le titre principal -->
    <h1>Remets la phrase dans l'ordre <button type="button" class="sound" id="titleSpeak" title="Écouter la consigne" onclick="speakConsigne()">🔊</button></h1>
    <div class="subtitle">Clique sur les mots pour construire ta phrase.</div>
  </header>

  <!-- Choix des niveaux -->
  <div class="mode" aria-label="Niveau de difficulté">
    <button id="level1" class="active" onclick="changeLevel(1)">Niveau 1 — Phrases simples (5 mots)</button>
    <button id="level2" onclick="changeLevel(2)">Niveau 2 — Phrases moyennes (6 à 8 mots)</button>
    <button id="level3" onclick="changeLevel(3)">Niveau 3 — Phrases longues (7 à 10 mots)</button>
  </div>

  <div class="hint" id="hint">Niveau 1 : Trouvez l'ordre correct des mots.</div>

  <!-- Zone de jeu -->
  <div class="exercise">
    <!-- Mots déposés par l'utilisateur -->
    <div class="zone-reponse" id="zoneReponse" aria-label="Votre phrase"></div>

    <!-- Mots à disposition, mélangés -->
    <div class="zone-mots" id="zoneMots" aria-label="Mots à choisir"></div>

    <div class="feedback" id="feedback"></div>

    <!-- Actions -->
    <div class="actions">
      <!-- 🔊 Nouveau bouton pour lire les mots placés en haut -->
      <button id="listenConstruct" type="button" style="margin-right:10px; border:2px solid #222; border-radius:18px; background:#fff; padding:13px 22px; font-size:18px; cursor:pointer;" onclick="listenCurrentPhrase()">🔊 Écouter</button>
      <button id="validate" disabled onclick="checkAnswer()">Valider</button>
      <button id="next" onclick="nextExercise()">Nouvelle phrase</button>
    </div>

    <div class="progress" id="progressText">Exercice 1</div>
  </div>
</div>

<script>
  // 1. LISTES DE PHRASES PERSONNALISABLES
  const phraseLists = {
    1: [
      "Le chat dort sur le tapis.",
      "Maman prépare un bon gâteau.",
      "Il fait très beau aujourd'hui.",
      "Le chien joue dans le jardin.",
      "Nous allons à l'école ensemble."
    ],
    2: [
      "Chaque matin, je prends un café bien chaud.",
      "Les enfants jouent au ballon dans la cour.",
      "Le boulanger fabrique du pain de manière artisanale.",
      "Elle achète des fruits frais au grand marché.",
      "Nous regardons un film intéressant ce soir à la télévision."
    ],
    3: [
      "Pour apprendre le français rapidement, il faut s'exercer très régulièrement chaque jour.",
      "Le grand bus bleu s'arrête brusquement devant la gare routière du centre ville.",
      "Les stagiaires écrivent une très longue lettre administrative pour demander un rendez vous.",
      "Après la fermeture définitive de l'usine, les ouvriers ont retrouvé un nouvel emploi stable.",
      "Dans la petite cuisine de notre appartement, mon père prépare un délicieux repas de fête."
    ]
  };

  let currentLevel = 1;
  let currentIndex = 0;
  let correctPhraseWords = [];
  let currentSelectionWords = [];

  const zoneReponse = document.getElementById("zoneReponse");
  const zoneMots = document.getElementById("zoneMots");
  const feedback = document.getElementById("feedback");
  const btnValidate = document.getElementById("validate");
  const progressText = document.getElementById("progressText");

  function initExercise() {
    feedback.textContent = "";
    feedback.className = "feedback";
    zoneReponse.innerHTML = "";
    zoneMots.innerHTML = "";
    btnValidate.disabled = true;
    currentSelectionWords = [];

    const list = phraseLists[currentLevel];
    // Boucle sur la liste si on arrive à la fin
    const phraseOrigine = list[currentIndex % list.length];
    
    // Découpage propre des mots (en ignorant les doubles espaces)
    correctPhraseWords = phraseOrigine.trim().split(/\s+/);
    
    // Création d'une copie et mélange des mots
    let shuffledWords = [...correctPhraseWords];
    while (JSON.stringify(shuffledWords) === JSON.stringify(correctPhraseWords)) {
      shuffledWords.sort(() => Math.random() - 0.5);
    }

    // Affichage des boutons de mots dans la zone du bas
    shuffledWords.forEach((word) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "word-btn";
      btn.textContent = word;
      btn.onclick = () => handleWordClick(btn, word);
      zoneMots.appendChild(btn);
    });

    progressText.textContent = `Phrase ${currentIndex + 1}`;
  }

  function handleWordClick(btn, word) {
    // Si la phrase est déjà validée, on bloque les clics
    if (feedback.textContent !== "") return;

    if (btn.parentNode === zoneMots) {
      // Déplacement vers le haut (zone réponse)
      zoneMots.removeChild(btn);
      zoneReponse.appendChild(btn);
    } else {
      // Déplacement vers le bas (remise à disposition)
      zoneReponse.removeChild(btn);
      zoneMots.appendChild(btn);
    }

    // Mise à jour de l'état du bouton valider
    const motsChoisis = zoneReponse.querySelectorAll(".word-btn").length;
    btnValidate.disabled = (motsChoisis !== correctPhraseWords.length);
  }

  function checkAnswer() {
    const currentButtons = zoneReponse.querySelectorAll(".word-btn");
    let isCorrect = true;

    currentButtons.forEach((btn, index) => {
      btn.classList.remove("correct", "wrong");
      if (btn.textContent === correctPhraseWords[index]) {
        btn.classList.add("correct");
      } else {
        btn.classList.add("wrong");
        isCorrect = false;
      }
    });

    if (isCorrect) {
      feedback.textContent = "👏 Excellent ! La phrase est correcte.";
      feedback.className = "feedback good";
      btnValidate.disabled = true;
    } else {
      feedback.textContent = "❌ Ce n'est pas tout à fait ça. Réessaie !";
      feedback.className = "feedback bad";
    }
  }

  function nextExercise() {
    currentIndex++;
    initExercise();
  }

  function changeLevel(level) {
    currentLevel = level;
    currentIndex = 0;
    
    // Gestion visuelle de l'onglet actif
    document.querySelectorAll(".mode button").forEach(b => b.classList.remove("active"));
    document.getElementById(`level${level}`).classList.add("active");
    
    const hints = {
      1: "Niveau 1 : Phrases simples (5 mots).",
      2: "Niveau 2 : Phrases moyennes (6 à 8 mots).",
      3: "Niveau 3 : Phrases longues (7 à 10 mots)."
    };
    document.getElementById("hint").textContent = hints[level];
    initExercise();
    }
    // Lancement au démarrage
    initExercise();
    
    
    
    
    function handleWordClick(btn, word) {
    // Si la phrase est déjà 100% bonne, on bloque les mouvements
    if (feedback.classList.contains("good")) return;

    // 🔄 Dès qu'on touche à un mot, on efface le message d'erreur et les couleurs
    feedback.textContent = "";
    feedback.className = "feedback";
    
    const tousLesMots = zoneReponse.querySelectorAll(".word-btn, .zone-mots .word-btn");
    document.querySelectorAll(".word-btn").forEach(b => b.classList.remove("correct", "wrong"));

    if (btn.parentNode === zoneMots) {
      // Déplacement vers le haut (zone réponse)
      zoneMots.removeChild(btn);
      zoneReponse.appendChild(btn);
    } else {
      // Déplacement vers le bas (remise à disposition)
      zoneReponse.removeChild(btn);
      zoneMots.appendChild(btn);
    }

    // Mise à jour de l'état du bouton valider
    const motsChoisis = zoneReponse.querySelectorAll(".word-btn").length;
    btnValidate.disabled = (motsChoisis !== correctPhraseWords.length);
  }
  
    // Fonction pour lire les mots actuellement placés dans la zone du haut
  function listenCurrentPhrase() {
    const boutonsChoisis = zoneReponse.querySelectorAll(".word-btn");
    let motsTextes = [];
    
    boutonsChoisis.forEach(btn => {
      motsTextes.push(btn.textContent);
    });

    // Si aucun mot n'est placé, on ne dit rien ou un message d'aide
    if (motsTextes.length === 0) {
      const u = new SpeechSynthesisUtterance("La zone est vide. Clique sur des mots.");
      u.lang = "fr-FR";
      window.speechSynthesis.speak(u);
      return;
    }

    // Reconstruction textuelle de la phrase en cours
    const phraseAEnoncer = motsTextes.join(" ");
    
    // Synthèse vocale native du navigateur
    window.speechSynthesis.cancel(); // Stoppe une éventuelle lecture en cours
    const utterance = new SpeechSynthesisUtterance(phraseAEnoncer);
    utterance.lang = "fr-FR";
    utterance.rate = 0.85; // Voix légèrement ralentie pour un public FLE / Alpha
    window.speechSynthesis.speak(utterance);
  }
  
    // Fonction pour lire la consigne générale au clic sur le haut-parleur du titre
  function speakConsigne() {
    window.speechSynthesis.cancel();
    const texte = "Remets la phrase dans l'ordre. Clique sur les mots pour construire ta phrase.";
    const utterance = new SpeechSynthesisUtterance(texte);
    utterance.lang = "fr-FR";
    utterance.rate = 0.85; // Rythme adapté
    window.speechSynthesis.speak(utterance);
  }



    
 // ### 💡 Quelques détails sur la conception :
//1. **Économie de frustration :** Si l'utilisateur se trompe de mot, il lui suffit de cliquer à nouveau sur le mot dans la zone supérieure claire pour qu'il redescende instantanément en bas. 
//2. **Auto-correction visuelle :** Lors de la validation, chaque mot se colore indépendamment. S'il est bien placé, il devient vert. S'il est mal placé, il devient rouge. Cela aide l'adulte en difficulté à voir exactement *où* sa structure syntaxique a échoué.
//3. **Personnalisation facile :** Tout se passe au tout début du bloc `<script>`. Vous avez trois listes (`1`, `2`, `3`) où vous pouvez ajouter, supprimer ou remplacer les phrases simplement en respectant les guillemets et les virgules.
   
    
</script>

</body></html>
